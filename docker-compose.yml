services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nirvana-cms-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nirvana
      POSTGRES_PASSWORD: nirvana
      POSTGRES_DB: nirvana_cms
    volumes:
      - nirvana_cms_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nirvana -d nirvana_cms"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: nirvana-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nirvana_cms_data:
  ollama_data:
