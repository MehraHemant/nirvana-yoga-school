services:
  mysql:
    image: mysql:8.4
    container_name: nirvana-cms-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: nirvana
      MYSQL_DATABASE: nirvana_cms
      MYSQL_USER: nirvana
      MYSQL_PASSWORD: nirvana
    volumes:
      - nirvana_cms_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pnirvana"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    container_name: nirvana-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  nirvana_cms_data:
  ollama_data:
